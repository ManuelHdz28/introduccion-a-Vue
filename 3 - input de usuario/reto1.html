<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Ejercicio 1 eventos de usuario y reactividad</title>
</head>
<body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <div id="app"></div>
    <script>
        const app = Vue.createApp({
            data(){
                return{
                    evt: "submit",
                    counter: 0
                    
                };
            },
            methods:{
                
               increment(){
                this.counter++;
               },
               decrement(){
                if(this.counter > 0) this.counter--;
               },
               reset(){
                if(this.counter != 0) this.counter = 0;
                
               }
            },
            template: `
            
            <div class="container text-center">
                <h2 class="mb-3">Contador: {{ counter }}</h2>

                <div class="button-group">
                    <button v-on:click="decrement" class="btn btn-primary">-</button>
                    <button v-on:click="reset" class="btn btn-secondary">Reset</button>
                    <button v-on:click="increment" class="btn btn-primary">+</button>
                </div>
            </div>
            <i data-lucide="angry"></i> 
            
            `

        }).mount('#app');

    </script>
    <script>
import { createIcons, angry } from 'lucide';

createIcons({
  icons: {
    angry
  }
});
</script>
    <style>
        button{
                    margin: 5px;
                    width: fit-content;
                    height: 50px;
                    font-size: 100px;
                    justify-content: center;
                    align-items: center;
                }
                div{
                    display: flex;
                    justify-content: center;
                    align-items: center;
                }
                h2{
                    font-size: 40px;
                    align-items: center;
                    justify-content: center;
                    display: flex;
                }
                body {
                    margin: 0;
                    height: 100vh; /* Ocupa todo el alto de la pantalla */
                    display: flex;
                    justify-content: center; /* Centrado horizontal */
                    align-items: center;     /* Centrado vertical */
                }
               /* El contenedor padre */
                .container {
                    display: flex;
                    flex-direction: column; /* Alinea los elementos uno arriba del otro */
                    align-items: center;    /* Centra horizontalmente el h2 y el grupo de botones */
                    gap: 20px;              /* Espacio entre el texto y los botones */
                }

                /* Los botones dentro de su grupo se mantienen en fila */
                .button-group {
                    display: flex;
                    gap: 10px;              /* Espacio entre botones */
                }
            </style>
</body>
</html>

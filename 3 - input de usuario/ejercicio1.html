<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 eventos de usuario y reactividad</title>
</head>
<body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <div id="app"></div>
    <script>
        const app = Vue.createApp({
            data(){
                return{
                    evt: "submit",
                    counter: 0
                };
            },
            methods:{
                submit(){
                    this.counter++;
                },
            },
            template: `
            <form v-on:[evt].prevent.stop="submit">
            contador: <button>{{ counter }}</button>
            
            </form>
            `

        }).mount('#app');

    </script>
</body>
</html>

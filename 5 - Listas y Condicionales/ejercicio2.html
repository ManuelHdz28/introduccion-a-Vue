<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <h2>Condicionales: Uso de Directivas Para Templates Dinamicos</h2>
        <p>Las directivas condicionales en Vue.js permiten mostrar o ocultar
            elementos HTML basados en condiciones lógicas.</p>
        <div id="app"></div>
        <script>
        const vm = Vue.createApp({
                data() {
                    return {
                        text: "Accede a tu Cuenta",
                        open: false,
                        username: "",
                        password: ""
                        
                    };
                },
                methods: {

                },
                watch: { //* El objeto watch se utiliza para definir funciones que observan cambios en propiedades reactivas específicas.
                    open(value) {
                        if (value) {
                            this.text = "Acceso Concedido";
                            
                        } else {
                            this.text = "Accede a tu Cuenta";
                            this.username = "";
                            this.password = "";
                    
                            
                        }
                    }

                },
                computed: {
                    label() {
                        return this.open ? "Cerrar Sesion" : "Acceder"
                    }
                },
                template: `<div class="container" :class="{ closed: !open, open: open }">
                    
                    <h1>{{ text }} </h1>
                    <div v-if="open">
                        <p> Hola, {{ username }}! Bienvenido de nuevo. </p>
                    </div>
                    <div v-else>
                        <div>
                        <label for="username">Usuario:</label>
                        <input type="text" id="username" v-model="username" />
                        </div>
                        <div>
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" v-model="password" />
                        </div>
                    </div>
                        <button @click="open = !open">
                            <div v-if="!open">Acceder</div> <!-- Esto es una condicional de Vue: Si open es false muestra Acceder -->
                            <div v-else>Cerrar Sesion</div> <!-- Esto es una condicional de Vue: Si open es true muestra Cerrar Sesion -->
                        </button>
                        </div>`,

            }).mount('#app');
    </script>
        <style>
        html,
        body {
            height: 100vh;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
    
        #app,
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }
    
        button {
            margin-top: 24px;
            border: none;
            background-color: white;
            padding: 8px 24px;
            border-radius: 12px;
        }
    
        .closed {
            background-color: #eca1a6;
        }
    
        .open {
            background-color: #b5e7a0;
        }
    </style>
    </body>
</html>

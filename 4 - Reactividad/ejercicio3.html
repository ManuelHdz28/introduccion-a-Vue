<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Estilos Reactivos: Uso directivas Style y Class</h2>
    <p>En Vue.js, puedes aplicar estilos dinámicos a elementos usando las directivas `v-bind:style` y `v-bind:class`.</p>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <div id="app"></div>
    <script>
        const vm = Vue.createApp({
                data() {
                    return {
                        text: "Puerta Cerrada",
                        open: false,
                        
                    };
                },
                methods: {

                },
                watch: { //* El objeto watch se utiliza para definir funciones que observan cambios en propiedades reactivas específicas.
                    open(value) {
                        if (value) {
                            this.text = "Puerta Abierta";
                            
                        } else {
                            this.text = "Puerta Cerrada";
                    
                            
                        }
                    }

                },
                computed: {
                    label() {
                        return this.open ? "Cerrar Puerta" : "Abrir Puerta"
                    }
                },
                template: `<div class="container" :class="{ closed: !open, open: open }">
                    
                    <h1>🚪{{ text }} </h1>
                        <button @click="open = !open">{{ label }}</button>
                        </div>`,

            }).mount('#app');
    </script>
    <style>
        html,
        body {
            height: 100vh;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
    
        #app,
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }
    
        button {
            margin-top: 24px;
            border: none;
            background-color: white;
            padding: 8px 24px;
            border-radius: 12px;
        }
    
        .closed {
            background-color: #eca1a6;
        }
    
        .open {
            background-color: #b5e7a0;
        }
    </style>
</body>
</html>

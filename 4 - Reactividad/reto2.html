<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <h2>RETO 2</h2>

        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <div id="app"></div>
        <script>
      const vm = Vue.createApp({
        data() {
          return {
            nombre: "",
            apellido: "",
            edad: 0,
            activo: false,
            textoActividad: "si",
          };
        },
        methods: {
          mostrarAlerta() {
            alert("Atencion Eres menor de edad");
          },
        },
        watch: {
          //* El objeto watch se utiliza para definir funciones que observan cambios en propiedades reactivas específicas.
          edad(nuevoValor) {
            if (nuevoValor < 18 && nuevoValor > 0) {
              this.mostrarAlerta();
            }
          },
          activo(value) {
            this.textoActividad = value ? "Sí" : "No";
          },
        },
        computed: {
          fullname() {
            return `${this.nombre} ${this.apellido}`;
          },
          label() {
            return this.activo ? "Desactivar Registro" : "Activar Registro";
          },
        },
        template: `
                <div class="container">
                    <h1>Formulario de Registro</h1>
                    <div class="button-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" v-model="nombre">
                    </div>
                    <div class="button-group">
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" v-model="apellido">
                    </div>
                    <div class="button-group">
                        <label for="edad">Edad:</label>
                        <input type="number" id="edad" v-model.number="edad" min="0">
                    </div>
                    <div class="button-group">
                        <button @click="activo = !activo" v-if="nombre && apellido && edad">{{ activo ? 'Desactivar' : 'Activar' }} Registro</button>
                    </div>

                </div>
                <div class="container" >
                    <div class="button-group">
                        <h2>Hola, {{ fullname }} ({{ edad }} años) </h2>
                        </div>
                    <div class="button-group">
                        <h1>Perfil del Usuario</h1> 
                        </div>
                        
                         <div class="button-group">
                        <p>Nombre Completo: {{ fullname }}</p>
                        </div>
                         <div class="button-group">
                        <p>Edad: {{ edad }} años</p>
                        </div>
                        <div class="button-group" >
                        <p>Activo: </p>
                        <div :class="{ closed: !activo, open: activo }">
                        <p>{{ activo ? 'Sí' : 'No' }}</p>
                        
                        </div>
                        </div>
                </div>
                `,
      }).mount("#app");
    </script>
        <style>
      html,
      body {
        height: 100vh;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }
      div {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #app,
      .container {
        display: flex;
        flex-direction: column; /* Alinea los elementos uno arriba del otro */
        align-items: center; /* Centra horizontalmente el h2 y el grupo de botones */
        gap: 20px; /* Espacio entre el texto y los botones */
      }

      .button-group {
        display: flex;
        gap: 10px; /* Espacio entre botones */
      }

      button {
        margin-top: 24px;
        border: 1px solid #333;
        background-color: #b2ffff;
        padding: 8px 24px;
        border-radius: 12px;
      }

      .closed {
        color: #eca1a6;
      }

      .open {
        color: rgb(86, 138, 86);
      }
    </style>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <h2>Comunicacion entre componentes: Props de Padre a Hijo</h2>
        <p>Props son una forma de pasar datos desde un componente padre a un componente hijo.</p>
        <div id="app"></div>
        <script>
        const app = Vue.createApp({
            data() {
                    return {
                        items: [
                            "Elemento 1",
                            "Elemento 2",
                            "Elemento 3",
                            "Elemento 4",
                            "Elemento 5",
                        ],
                    };
                },
                template: `
                <ul>
                    <v-item v-for="item in items" v-bind:text="item"> {{ item }}</v-item> <!-- uso del componente hijo y paso de prop (v-bind es una directiva de Vue que sirve para pasar props a un componente hijo) -->
                   
                </ul>
                `,

            });

            app.component("v-item", { // aqui van los componentes hijos: no se puedn cambiar datos del componente padre desde aqui
              // props: ["text"], // Definición de la prop que se recibe del componente padre (uso alternativo: este uso es menos común)
                props: { // Definición de la prop que se recibe del componente padre (uso normal)
                    text: String, // Definición del tipo de dato esperado para la prop de un tipo String
                    texto:{ // Definición de la prop con valor por defecto de un tipo jSON
                        type: String,
                        default: "Texto por defecto" // Valor por defecto en caso de que no se pase la prop desde el componente padre
                    }
                },
                template: `
                <li> {{ text }} - {{ texto }}</li>
                `,
            });
            const vm = app.mount('#app');

    </script>
        
    </style>
    </body>
</html>
